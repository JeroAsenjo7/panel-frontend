<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <mat-card class="w-full max-w-md">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>Panel de administración</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-2 mt-6">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-icon matSuffix>mail</mat-icon>
          <mat-error *ngIf="email.hasError('required')">El email es obligatorio</mat-error>
          <mat-error *ngIf="email.hasError('email')">Ingresá un email válido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="password.hasError('required')">La contraseña es obligatoria</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="h-11" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20" class="mx-auto"></mat-spinner>
          <span *ngIf="!loading">Ingresar</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="justify-center pb-4">
      <span class="text-sm text-gray-600">
        ¿No tenés cuenta?
        <a routerLink="/auth/register" class="text-indigo-600 font-medium hover:underline">Registrate</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
