<mat-toolbar *ngIf="currentUser$ | async as user" color="primary" class="gap-2">
  <span class="font-semibold mr-4">Panel Admin</span>
  <a mat-button routerLink="/products">Productos</a>
  <a *ngIf="user.role === 'admin'" mat-button routerLink="/users">Usuarios</a>

  <span class="flex-1"></span>

  <span class="text-sm hidden sm:inline">{{ user.name }} · {{ user.role }}</span>
  <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<router-outlet></router-outlet>
